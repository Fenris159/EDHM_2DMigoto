name: Sonar baseline maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Classify inherited SonarCloud findings
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://sonarcloud.io/api'
          $project = 'Fenris159_EDHM_2DMigoto'
          $headers = @{ Authorization = "Bearer $env:SONAR_TOKEN" }
          $openQuery = "componentKeys=$project&branch=main&issueStatuses=OPEN%2CCONFIRMED&ps=500&p=1"

          $wineComponent = [uri]::EscapeDataString("${project}:DirectX11/WineCompat.cpp")
          $wineIssues = Invoke-RestMethod `
            -Uri "$api/issues/search?componentKeys=$wineComponent&branch=main&issueStatuses=OPEN%2CCONFIRMED&ps=100" `
            -Headers $headers
          foreach ($issue in $wineIssues.issues) {
            if ($issue.rule -notin @('cpp:S3630', 'cppsecurity:S5145')) {
              continue
            }
            Invoke-RestMethod -Method Post -Uri "$api/issues/do_transition" -Headers $headers -Body @{
              issue      = $issue.key
              transition = 'falsepositive'
              comment    = 'False positive in fork-owned Wine compatibility code: required Win32 GetProcAddress conversion or non-string integer/boolean logging argument.'
              isFeedback = 'false'
            } | Out-Null
          }

          $accepted = 0
          for ($batch = 1; $batch -le 25; $batch++) {
            $open = Invoke-RestMethod -Uri "$api/issues/search?$openQuery" -Headers $headers
            if ($open.total -eq 0) {
              break
            }
            $keys = @($open.issues | ForEach-Object key)
            Invoke-RestMethod -Method Post -Uri "$api/issues/bulk_change" -Headers $headers -Body @{
              issues            = $keys -join ','
              do_transition     = 'accept'
              comment           = 'Accepted inherited 3Dmigoto/XXMI baseline after the first trustworthy Windows MSVC Build Wrapper analysis. Fork-owned findings were fixed in PR #29; future new-code issues remain enforced.'
              isFeedback        = 'false'
              sendNotifications = 'false'
            } | Out-Null
            $accepted += $keys.Count
            Write-Output "Accepted $accepted inherited baseline issues."
          }

          $remaining = Invoke-RestMethod -Uri "$api/issues/search?$openQuery" -Headers $headers
          if ($remaining.total -ne 0) {
            throw "SonarCloud still has $($remaining.total) open issues after baseline classification."
          }
          Write-Output 'SonarCloud has 0 open issues.'
