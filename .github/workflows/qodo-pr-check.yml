name: Qodo PR check

on:
  pull_request:
    branches: [main, xxmi-base]
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  qodo:
    name: Qodo AI review
    if: ${{ github.event.sender.type != 'Bot' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Qodo secrets
        id: gate
        shell: bash
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${OPENAI_KEY}" ] && [ "${OPENAI_KEY}" != "dummy_key" ]; then
            OPENAI_KEY_TO_USE="${OPENAI_KEY}"
          elif [ -n "${OPENAI_API_KEY}" ] && [ "${OPENAI_API_KEY}" != "dummy_key" ]; then
            OPENAI_KEY_TO_USE="${OPENAI_API_KEY}"
          else
            echo "run_qodo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Qodo skipped: OPENAI_KEY / OPENAI_API_KEY is missing or invalid."
            exit 0
          fi

          echo "openai_key=${OPENAI_KEY_TO_USE}" >> "$GITHUB_OUTPUT"
          echo "run_qodo=true" >> "$GITHUB_OUTPUT"

      - name: Run PR Agent review
        if: ${{ steps.gate.outputs.run_qodo == 'true' }}
        uses: docker://pragent/pr-agent:0.41.0-github_action
        env:
          OPENAI_KEY: ${{ steps.gate.outputs.openai_key }}
          OPENAI_API_KEY: ${{ steps.gate.outputs.openai_key }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
