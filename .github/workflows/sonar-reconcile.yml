name: Reconcile Sonar issue history

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Apply the selected transition to main-branch issues and run a fresh analysis
        required: true
        type: choice
        options:
          - "no"
          - "yes"
      transition:
        description: Sonar workflow transition to apply
        required: true
        default: reopen
        type: choice
        options:
          - reopen
          - resolve
          - falsepositive
      expected_count:
        description: Exact number of matching issues required before any transition
        required: true
        default: "0"
        type: string

permissions:
  actions: write
  contents: read

jobs:
  reconcile:
    name: Reconcile Sonar issue history
    if: ${{ inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply selected issue transition
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_TRANSITION: ${{ inputs.transition }}
          SONAR_EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: >-
          ./scripts/sonar-reconcile.ps1
          -ProjectKey Fenris159_EDHM_2DMigoto
          -Branch main
          -Transition "$env:SONAR_TRANSITION"
          -ExpectedCount $env:SONAR_EXPECTED_COUNT

      - name: Dispatch fresh main analysis
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sonar-pr-check.yml --ref main -f full_analysis=true
