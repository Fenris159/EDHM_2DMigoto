name: Runtime regression checks

on:
  push:
    branches: [upstream-improvements]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      mutation_checks:
        description: Deliberately break each repaired behavior and verify detection
        type: boolean
        default: false
      mutation_case_filter:
        description: Optional comma-separated native cases for focused mutation checks
        type: string
        default: ''
      proxy_frame_mutations:
        description: Verify frame-action assertions by breaking and restoring the product DLL
        type: boolean
        default: false
      mechanism_benchmarks:
        description: Capture interpreter and WARP view CPU mechanism measurements
        type: boolean
        default: false
      query_benchmarks:
        description: Compare repeated texture queries with reading the assigned row, without a game
        type: boolean
        default: false
      entry_benchmark_baseline_ref:
        description: Optional ancestor commit for an isolated public-entry comparison with the same harness
        type: string
        default: ''
      benchmark_baseline_run:
        description: Optional successful same-repository run with a matching x64 benchmark executable
        type: string
        default: ''
      proxy_chain_baseline_run:
        description: Optional trusted x64 DLL build that must expose the pre-fix proxy bypass
        type: string
        default: ''
      proxy_chain_downstream_baseline_run:
        description: Optional trusted x64 build that must expose the combined downstream-proxy bypass
        type: string
        default: ''

permissions:
  contents: read

jobs:
  readiness-tools:
    name: Readiness tools and runner checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Python tools and runners
        run: python -m unittest discover -s RuntimeTests -p 'test_*.py' -v
      - name: Check context-owned publication policy
        run: |
          mkdir -p .quality/ini-publication
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic RuntimeTests/IniParamsPublicationTests.cpp -o .quality/ini-publication/policy-tests
          .quality/ini-publication/policy-tests
  proxy-chain:
    name: Product DLL proxy chain (${{ matrix.platform }})
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[17.0,18.0)'
      - name: Verify reload-runner timeout evidence
        run: python -m unittest discover -s RuntimeTests -p test_reload_notification_runner.py -v
      - name: Build product and proxy boundary fixtures
        shell: pwsh
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          & msbuild DirectX11/DirectX11.vcxproj -target:Build `
            -property:Configuration=Release "-property:Platform=$env:TEST_PLATFORM" `
            "-property:SolutionDir=$pwd/" -property:EdhmStrictBuild=true `
            -nodeReuse:false -verbosity:minimal -restore:false
          if ($LASTEXITCODE -ne 0) { throw 'Product DLL build failed' }
          foreach ($fixture in @('false', 'true')) {
            & msbuild RuntimeTests/ProxyChainTests.vcxproj -target:Build `
              -property:Configuration=Release "-property:Platform=$env:TEST_PLATFORM" `
              "-property:EdhmChainFixture=$fixture" -property:EdhmStrictBuild=true `
              -nodeReuse:false -verbosity:minimal -restore:false
            if ($LASTEXITCODE -ne 0) { throw "Proxy fixture build failed: $fixture" }
          }
          & msbuild RuntimeTests/ReloadNotificationTests.vcxproj -target:Build `
            -property:Configuration=Release "-property:Platform=$env:TEST_PLATFORM" `
            -property:EdhmStrictBuild=true -nodeReuse:false -verbosity:minimal -restore:false
          if ($LASTEXITCODE -ne 0) { throw 'Reload notification fixture build failed' }
          foreach ($fixture in @('false', 'true')) {
            & msbuild RuntimeTests/ProxyFrameTests.vcxproj -target:Build `
              -property:Configuration=Release "-property:Platform=$env:TEST_PLATFORM" `
              "-property:EdhmFrameFixture=$fixture" -property:EdhmStrictBuild=true `
              -nodeReuse:false -verbosity:minimal -restore:false
            if ($LASTEXITCODE -ne 0) { throw "Frame proxy fixture build failed: $fixture" }
          }
      - name: Check game frame actions through a suppressing Present proxy
        shell: pwsh
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          $bin = ".quality/proxy-frame/$env:TEST_PLATFORM"
          $product = if ($env:TEST_PLATFORM -eq 'Win32') { 'x32' } else { 'x64' }
          foreach ($case in @('flow', 'controls', 'flow1', 'controls1')) {
            & python RuntimeTests/run_proxy_frame_tests.py --dll "$product/Release/d3d11.dll" `
              --exe "$bin/ProxyFrameTests.exe" --fixture "$bin/FrameProxyFixture.dll" `
              --case $case --output "$bin/$case-results"
            if ($LASTEXITCODE -ne 0) { throw "Proxy frame actions failed: $case" }
          }
      - name: Require the previous release to expose starved frame actions
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $bin = '.quality/proxy-frame/x64'
          $baseline = "$bin/previous-d3d11.dll"
          Invoke-WebRequest 'https://github.com/Fenris159/EDHM_2DMigoto/releases/download/v0.1.7/d3d11.dll' -OutFile $baseline
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash -ne '0d72ebbe352d2d627550bfc81e7221daf55a52a9aaf9b997d66c671abc5972e1') {
            throw 'Previous frame-action release checksum mismatch'
          }
          & python RuntimeTests/run_proxy_frame_tests.py --dll $baseline `
            --exe "$bin/ProxyFrameTests.exe" --fixture "$bin/FrameProxyFixture.dll" `
            --output "$bin/baseline-results" --expect-starvation
          if ($LASTEXITCODE -ne 0) { throw 'Previous frame-action starvation was not detected' }
      - name: Obtain pinned EDUP release for the x64 integration check
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .quality/edup-0.22.1 | Out-Null
          $archive = '.quality/edup-0.22.1/core.zip'
          Invoke-WebRequest 'https://github.com/characterecho-sean/ed-unofficial-patch/releases/download/v0.22.1/ed-up-core-0.22.1.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '4292718f50ad14bd40825697a2a75a83d4db3bc9e845dae6a3a04c11af6d11c4') {
            throw 'EDUP release archive checksum mismatch'
          }
          Expand-Archive $archive .quality/edup-0.22.1/core
      - name: Check product loading and proxy policies
        shell: pwsh
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          $bin = ".quality/proxy-chain/$env:TEST_PLATFORM"
          $product = if ($env:TEST_PLATFORM -eq 'Win32') { 'x32' } else { 'x64' }
          Copy-Item "$product/Release/d3d11.dll" "$bin/candidate-d3d11.dll"
          $extra = @()
          if ($env:TEST_PLATFORM -eq 'x64') { $extra = @('--edup', '.quality/edup-0.22.1/core/d3d11.dll') }
          & python RuntimeTests/run_proxy_chain_tests.py --dll "$bin/candidate-d3d11.dll" `
            --fixture "$bin/ProxyChainFixture.dll" --exe "$bin/ProxyChainTests.exe" `
            --output "$bin/candidate-results" @extra
          if ($LASTEXITCODE -ne 0) { throw 'Proxy-chain behavior checks failed' }
      - name: Check D3D12 helper swap-chain interoperability
        shell: pwsh
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          $bin = ".quality/proxy-chain/$env:TEST_PLATFORM"
          & python RuntimeTests/run_proxy_chain_tests.py --d3d12-only `
            --dll "$bin/candidate-d3d11.dll" --fixture "$bin/ProxyChainFixture.dll" `
            --exe "$bin/ProxyChainTests.exe" --output "$bin/d3d12-results"
          if ($LASTEXITCODE -ne 0) { throw 'D3D12 helper swap-chain behavior checks failed' }
      - name: Check final callbacks retained past product teardown
        shell: pwsh
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          $bin = ".quality/proxy-chain/$env:TEST_PLATFORM"
          $extra = @()
          if ($env:TEST_PLATFORM -eq 'x64') {
            New-Item -ItemType Directory -Force .quality/edup-0.22.2 | Out-Null
            $archive = '.quality/edup-0.22.2/core.zip'
            Invoke-WebRequest 'https://github.com/characterecho-sean/ed-unofficial-patch/releases/download/v0.22.2/ed-up-core-0.22.2.zip' -OutFile $archive
            if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '9f6f2633af2b55ec344d305253b35b7573d3959be6c6aba89be4d46afb47ec04') {
              throw 'EDUP 0.22.2 archive checksum mismatch'
            }
            Expand-Archive $archive .quality/edup-0.22.2/core
            $extra = @('--edup', '.quality/edup-0.22.2/core/d3d11.dll')
          }
          & python RuntimeTests/run_proxy_chain_tests.py --shutdown-only `
            --dll "$bin/candidate-d3d11.dll" --fixture "$bin/ProxyChainFixture.dll" `
            --exe "$bin/ProxyChainTests.exe" --output "$bin/shutdown-results" @extra
          if ($LASTEXITCODE -ne 0) { throw 'Resource shutdown behavior checks failed' }
      - name: Require the previous release to expose late callback failure
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $bin = '.quality/proxy-chain/x64'
          $baseline = "$bin/previous-shutdown-d3d11.dll"
          Invoke-WebRequest 'https://github.com/Fenris159/EDHM_2DMigoto/releases/download/v0.1.5/d3d11.dll' -OutFile $baseline
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash -ne 'acf05b38b8b87c4e1a192a40af1b26f427277f5f9fb1dacd6412078fa8bd7615') {
            throw 'Previous shutdown release checksum mismatch'
          }
          & python RuntimeTests/run_proxy_chain_tests.py --shutdown-only --expect-shutdown-failure `
            --dll $baseline --fixture "$bin/ProxyChainFixture.dll" --exe "$bin/ProxyChainTests.exe" `
            --output "$bin/previous-shutdown-results" --edup .quality/edup-0.22.2/core/d3d11.dll
          if ($LASTEXITCODE -ne 0) { throw 'Previous late callback failure was not detected' }
      - name: Check reload notification pixels and GPU constants
        shell: pwsh
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          $bin = ".quality/reload-notification/$env:TEST_PLATFORM"
          & python RuntimeTests/run_reload_notification_tests.py `
            --dll ".quality/proxy-chain/$env:TEST_PLATFORM/candidate-d3d11.dll" `
            --exe "$bin/ReloadNotificationTests.exe" --output "$bin/candidate-results"
          if ($LASTEXITCODE -ne 0) { throw 'Reload notification behavior checks failed' }
      - name: Verify notification checks detect the previous visible behavior
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $baseline = '.quality/reload-notification/x64/previous-d3d11.dll'
          Invoke-WebRequest 'https://github.com/Fenris159/EDHM_2DMigoto/releases/download/v0.1.4-beta.2/d3d11.dll' -OutFile $baseline
          if ((Get-FileHash $baseline -Algorithm SHA256).Hash -ne '2cacf5a9bdc34955339cc72088225c83dd656fe97e329a1ee504c0145ae7a4ac') {
            throw 'Previous release DLL checksum mismatch'
          }
          & python RuntimeTests/run_reload_notification_tests.py --dll $baseline `
            --exe .quality/reload-notification/x64/ReloadNotificationTests.exe `
            --output .quality/reload-notification/x64/baseline-results --expect-visible
          if ($LASTEXITCODE -ne 0) { throw 'Previous visible notification behavior was not detected' }
      - name: Require pre-fix builds to expose the proxy policy regressions
        if: (inputs.proxy_chain_baseline_run != '' || inputs.proxy_chain_downstream_baseline_run != '') && matrix.platform == 'x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.proxy_chain_baseline_run }}
          DOWNSTREAM_BASELINE_RUN: ${{ inputs.proxy_chain_downstream_baseline_run }}
        run: |
          $controls = @(
            @{ run = $env:BASELINE_RUN; label = 'original'; mode = '--expect-bypass' },
            @{ run = $env:DOWNSTREAM_BASELINE_RUN; label = 'downstream'; mode = '--expect-downstream-bypass' }
          )
          foreach ($control in $controls) {
            $id = $control.run
            if (-not $id) { continue }
            if ($id -notmatch '^[0-9]+$') { throw 'Baseline run must be numeric' }
            $run = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$id" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or
                $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
                $run.event -notin @('push', 'workflow_dispatch')) { throw 'Baseline run is not trusted' }
            $directory = ".quality/proxy-chain/baseline-$($control.label)"
            & gh run download $id -R $env:GITHUB_REPOSITORY -p 'd3d11-release-x64-*' -D $directory
            if ($LASTEXITCODE -ne 0) { throw 'Could not obtain pre-fix DLL' }
            $dll = @(Get-ChildItem $directory -Recurse -Filter d3d11.dll)
            if ($dll.Count -ne 1) { throw 'Expected one baseline DLL' }
            $extra = @($control.mode)
            if ($control.label -eq 'original') { $extra += @('--edup', '.quality/edup-0.22.1/core/d3d11.dll') }
            & python RuntimeTests/run_proxy_chain_tests.py --dll $dll[0].FullName `
              --fixture .quality/proxy-chain/x64/ProxyChainFixture.dll `
              --exe .quality/proxy-chain/x64/ProxyChainTests.exe `
              --output ".quality/proxy-chain/x64/baseline-$($control.label)-results" @extra
            if ($LASTEXITCODE -ne 0) { throw 'Pre-fix bypass was not detected' }
          }
      - name: Verify proxy frame regression sensitivity
        if: inputs.proxy_frame_mutations && matrix.platform == 'x64'
        run: python RuntimeTests/check_proxy_frame_mutations.py
      - name: Upload proxy-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proxy-chain-evidence-${{ matrix.platform }}-${{ github.sha }}
          path: |
            .quality/proxy-frame/${{ matrix.platform }}/
            .quality/proxy-frame-mutations/
            .quality/proxy-chain/${{ matrix.platform }}/**/results.json
            .quality/proxy-chain/${{ matrix.platform }}/**/shutdown-complete.txt
            .quality/proxy-chain/${{ matrix.platform }}/candidate-d3d11.dll
            ${{ matrix.platform == 'Win32' && 'x32' || 'x64' }}/Release/3Dmigoto.pdb
            ${{ matrix.platform == 'Win32' && 'x32' || 'x64' }}/Release/d3d11.map
            .quality/proxy-chain/${{ matrix.platform }}/ProxyChainTests.exe
            .quality/proxy-chain/${{ matrix.platform }}/ProxyChainFixture.dll
            .quality/proxy-chain/${{ matrix.platform }}/**/stdout.txt
            .quality/proxy-chain/${{ matrix.platform }}/**/stderr.txt
            .quality/proxy-chain/${{ matrix.platform }}/**/d3d11_log.txt
            .quality/proxy-chain/${{ matrix.platform }}/**/edvr_logs/
            .quality/reload-notification/${{ matrix.platform }}/**/results.json
            .quality/reload-notification/${{ matrix.platform }}/**/stdout.txt
            .quality/reload-notification/${{ matrix.platform }}/**/stderr.txt
            .quality/reload-notification/${{ matrix.platform }}/**/d3d11_log.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload validated product DLL
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proxy-chain-dll-${{ matrix.platform }}-${{ github.sha }}
          path: .quality/proxy-chain/${{ matrix.platform }}/candidate-d3d11.dll
          if-no-files-found: error
          retention-days: 14
  runtime-tests:
    permissions:
      contents: read
      actions: read
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '[17.0,18.0)'
      - name: Verify Python runners and process-tree cleanup
        run: python -m unittest discover -s RuntimeTests -p 'test_*.py' -v
      - name: Build native runtime checks
        shell: pwsh
        run: >-
          msbuild DirectX11/RuntimeTests.vcxproj
          -property:Configuration=Release -property:Platform=${{ matrix.platform }}
          -property:SolutionDir="$pwd/" -property:EdhmStrictBuild=true
          -target:Build -nodeReuse:false -verbosity:minimal -restore:false
      - name: Build and check the production D3D publication adapter
        shell: pwsh
        run: |
          & msbuild RuntimeTests/IniParamsUploadTests.vcxproj -target:Build `
            -property:Configuration=Release -property:Platform=${{ matrix.platform }} `
            -property:EdhmStrictBuild=true -nodeReuse:false -verbosity:minimal -restore:false
          if ($LASTEXITCODE -ne 0) { throw 'IniParams upload fixture build failed' }
          & ".quality/ini-publication/${{ matrix.platform }}/IniParamsUploadTests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'IniParams D3D upload checks failed' }
      - name: Validate prepared shader objects without the product DLL
        shell: pwsh
        run: |
          & msbuild RuntimeTests/PreparedShaderTests.vcxproj -target:Build `
            -property:Configuration=Release -property:Platform=${{ matrix.platform }} `
            -property:EdhmStrictBuild=true -nodeReuse:false -verbosity:minimal -restore:false
          if ($LASTEXITCODE -ne 0) { throw 'Prepared shader checker build failed' }
          $checker = '.quality/prepared-shaders/${{ matrix.platform }}/PreparedShaderTests.exe'
          & $checker --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Prepared shader self-check failed' }
          $valid = '.quality/prepared-shaders/${{ matrix.platform }}/authored-ps.dxbc'
          $invalid = '.quality/prepared-shaders/${{ matrix.platform }}/malformed.dxbc'
          & python -c "from pathlib import Path; Path('$valid').write_bytes(bytes.fromhex(Path('RuntimeTests/fixtures/preparer-minimal-ps.dxbc.hex').read_text())); Path('$invalid').write_bytes(b'DXBC' + bytes(12))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage authored shader fixtures' }
          $before = (Get-FileHash $valid -Algorithm SHA256).Hash
          $badBefore = (Get-FileHash $invalid -Algorithm SHA256).Hash
          & $checker ps $valid
          if ($LASTEXITCODE -ne 0) { throw 'Authored frozen PS failed native creation' }
          & $checker ps $invalid
          if ($LASTEXITCODE -ne 1) { throw 'Malformed input did not return validation failure' }
          if ((Get-FileHash $valid -Algorithm SHA256).Hash -ne $before -or
              (Get-FileHash $invalid -Algorithm SHA256).Hash -ne $badBefore) {
            throw 'Shader checker changed an input'
          }
      - name: Measure successful publication kernels
        id: publication_measurements
        if: inputs.mechanism_benchmarks && matrix.platform == 'x64'
        shell: pwsh
        run: |
          & .quality/ini-publication/x64/IniParamsUploadTests.exe --benchmark 21 --iterations 50000 > .quality/ini-publication/x64/upload-benchmark.log
          if ($LASTEXITCODE -ne 0) { throw 'Publication kernel measurements failed' }
      - name: Retain publication kernel evidence
        if: always() && inputs.mechanism_benchmarks && matrix.platform == 'x64' && steps.publication_measurements.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-kernels-${{ github.sha }}
          path: .quality/ini-publication/x64/upload-benchmark.log
          if-no-files-found: error
          retention-days: 14
      - name: Exercise runtime behavior
        shell: pwsh
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          $exe = ".quality/runtime-tests/$env:TEST_PLATFORM/Release/RuntimeTests.exe"
          $failures = @()
          foreach ($case in @('empty-groups', 'leading-dot', 'pending-save', 'pool-reset', 'constant-stride', 'iniparams-transition-retry', 'iniparams-command-retry', 'iniparams-contexts', 'entry-path', 'query-assigned-row', 'reference-order', 'reference-cycles', 'pool-metadata', 'missing-metadata', 'nested-metadata', 'metadata-resource', 'metadata-resource-identity', 'metadata-lazy-index', 'metadata-fifo', 'metadata-expiration', 'metadata-hot-identity', 'metadata-cached-spatial', 'metadata-static-pin', 'metadata-alias', 'metadata-alias-expiration', 'metadata-destination-key-spatial', 'metadata-destination-key-fifo', 'pool-identifiers', 'store-values', 'store-views', 'store-failure', 'region-copy', 'region-vertex-bytes', 'region-views', 'region-cb', 'settings-atomic', 'settings-lifecycle', 'settings-deferred', 'settings-save-update', 'settings-batch-reload', 'settings-save-reload', 'analysis-reload', 'constants-order', 'ini-sections', 'if-conditions', 'expression-grammar', 'profiling-collections', 'profiling-reload', 'matching-diagnostics', 'view-reuse', 'view-descriptors', 'view-cache-metadata', 'view-ownership', 'view-failure', 'region-cb-small', 'view-clear', 'view-clear-integer', 'view-clear-stencil', 'metadata-static-variable', 'pool-learned-flags', 'pool-scalar-precedence', 'view-this-cache', 'profiling-zero-frame', 'resource-final-release', 'resource-retirement')) {
            & $exe $case
            if ($LASTEXITCODE -ne 0) { $failures += "$case (exit $LASTEXITCODE)" }
          }
          if ($failures.Count -ne 0) { throw "Runtime regression checks failed: $($failures -join ', ')" }
      - name: Verify regression sensitivity
        if: inputs.mutation_checks && matrix.platform == 'x64'
        shell: pwsh
        env:
          MUTATION_CASE_FILTER: ${{ inputs.mutation_case_filter }}
        run: |
          $mutationArguments = @()
          if ($env:MUTATION_CASE_FILTER) {
            foreach ($case in $env:MUTATION_CASE_FILTER.Split(',')) {
              $mutationArguments += @('--case', $case.Trim())
            }
          }
          & python RuntimeTests/check_mutations.py @mutationArguments
          if ($LASTEXITCODE -ne 0) { throw 'Mutation sensitivity checks failed' }
      - name: Measure public command entry points with a shared harness
        id: command_entry_measurements
        if: inputs.mechanism_benchmarks && matrix.platform == 'x64'
        shell: pwsh
        env:
          ENTRY_BASELINE_REF: ${{ inputs.entry_benchmark_baseline_ref }}
        run: |
          $entryDirectory = ".quality/entry-benchmark/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $entryDirectory | Out-Null
          @{ status = 'preparing'; candidate_source = $env:GITHUB_SHA; baseline_requested = $env:ENTRY_BASELINE_REF } |
            ConvertTo-Json | Set-Content "$entryDirectory/metadata.json" -Encoding utf8
          $candidate = (Resolve-Path '.quality/runtime-tests/x64/Release/RuntimeTests.exe').Path
          $variants = @{ B = $candidate }
          $order = @('B')
          $baselineSource = $null
          if ($env:ENTRY_BASELINE_REF) {
            if ($env:ENTRY_BASELINE_REF -notmatch '^[0-9a-fA-F]{7,40}$') { throw 'Entry baseline must be a commit hash' }
            $baselineRevision = & git rev-parse --verify "$($env:ENTRY_BASELINE_REF)^{commit}"
            if ($LASTEXITCODE -ne 0) { throw 'Entry baseline commit is unavailable' }
            $baselineSource = $baselineRevision.Trim()
            & git merge-base --is-ancestor $baselineSource HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Entry baseline must be an ancestor of this source' }
            $productionChanges = @(& git diff --name-only $baselineSource HEAD | Where-Object {
              $_ -notmatch '^(docs/|RuntimeTests/|scripts/|\.github/|GLOSSARY\.md$)'
            })
            if ($LASTEXITCODE -ne 0 -or $productionChanges.Count -ne 1 -or
                $productionChanges[0] -ne 'DirectX11/CommandList.cpp') {
              throw 'Entry comparison requires an isolated CommandList.cpp production change'
            }
            $baselineDirectory = "$entryDirectory/baseline-source"
            & git worktree add --detach $baselineDirectory $baselineSource
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare entry baseline worktree' }
            # Both variants compile the exact same public-entry harness.
            Copy-Item RuntimeTests/RuntimeTests.cpp "$baselineDirectory/RuntimeTests/RuntimeTests.cpp"
            Copy-Item RuntimeTests/D3DMapBoundary.h "$baselineDirectory/RuntimeTests/D3DMapBoundary.h"
            $baselineRoot = (Resolve-Path $baselineDirectory).Path
            & msbuild "$baselineRoot/DirectX11/RuntimeTests.vcxproj" -target:Build `
              -property:Configuration=Release -property:Platform=x64 `
              "-property:SolutionDir=$baselineRoot/" -property:EdhmStrictBuild=true `
              -nodeReuse:false -verbosity:minimal -restore:false
            if ($LASTEXITCODE -ne 0) { throw 'Shared-harness entry baseline build failed' }
            $variants.A = (Resolve-Path "$baselineRoot/.quality/runtime-tests/x64/Release/RuntimeTests.exe").Path
            $order = @('A', 'B', 'B', 'A', 'B', 'A', 'A', 'B')
          }
          $metadata = @{
            status = 'prepared'
            baseline_source = $baselineSource
            candidate_source = $env:GITHUB_SHA
            shared_harness_sha256 = (Get-FileHash RuntimeTests/RuntimeTests.cpp -Algorithm SHA256).Hash
            boundary_fixture_sha256 = (Get-FileHash RuntimeTests/D3DMapBoundary.h -Algorithm SHA256).Hash
            processor = $env:PROCESSOR_IDENTIFIER
            os = [Environment]::OSVersion.VersionString
            debug_layer = $false
            no_present_or_game = $true
            variants = @{}
            runs = @()
          }
          foreach ($variant in $variants.Keys) {
            $metadata.variants[$variant] = @{ sha256 = (Get-FileHash $variants[$variant] -Algorithm SHA256).Hash }
          }
          $metadata | ConvertTo-Json -Depth 8 | Set-Content "$entryDirectory/metadata.json" -Encoding utf8
          $sequence = 0
          foreach ($variant in $order) {
            & $variants[$variant] benchmark-entries 11 > "$entryDirectory/$sequence-$variant.csv" 2> "$entryDirectory/$sequence-$variant.stderr.log"
            $exitCode = $LASTEXITCODE
            $metadata.runs += @{ sequence = $sequence; variant = $variant; exit_code = $exitCode }
            $metadata.status = if ($exitCode -eq 0) { 'running' } else { 'failed' }
            $metadata | ConvertTo-Json -Depth 8 | Set-Content "$entryDirectory/metadata.json" -Encoding utf8
            if ($exitCode -ne 0) { throw "Public-entry benchmark failed: $variant (exit $exitCode)" }
            $sequence++
          }
          $metadata.status = 'complete'
          $metadata | ConvertTo-Json -Depth 8 | Set-Content "$entryDirectory/metadata.json" -Encoding utf8
      - name: Retain public-entry measurement evidence
        if: always() && inputs.mechanism_benchmarks && matrix.platform == 'x64' && steps.command_entry_measurements.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: entry-benchmarks-${{ github.sha }}
          path: |
            .quality/entry-benchmark/*/metadata.json
            .quality/entry-benchmark/*/*.csv
            .quality/entry-benchmark/*/*.stderr.log
          if-no-files-found: error
          retention-days: 14
      - name: Measure CPU mechanisms without the debug layer
        if: inputs.mechanism_benchmarks && matrix.platform == 'x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_BASELINE_RUN: ${{ inputs.benchmark_baseline_run }}
        run: |
          $output = '.quality/runtime-benchmarks'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $candidate = (Resolve-Path '.quality/runtime-tests/x64/Release/RuntimeTests.exe').Path
          $variants = @{ B = $candidate }
          $order = @('B')
          $run = $null
          if ($env:BENCHMARK_BASELINE_RUN) {
            if ($env:BENCHMARK_BASELINE_RUN -notmatch '^[0-9]+$') { throw 'Baseline run must be a numeric run ID' }
            $run = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BENCHMARK_BASELINE_RUN" |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or
                $run.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or
                $run.event -notin @('push', 'workflow_dispatch')) {
              throw 'Baseline must be a successful trusted push/manual run from this repository'
            }
            & gh run download $env:BENCHMARK_BASELINE_RUN -R $env:GITHUB_REPOSITORY `
              -p 'runtime-checks-x64-*' -D '.quality/benchmark-baseline'
            if ($LASTEXITCODE -ne 0) { throw 'Could not download baseline executable' }
            $baseline = @(Get-ChildItem '.quality/benchmark-baseline' -Recurse -Filter 'RuntimeTests.exe')
            if ($baseline.Count -ne 1) { throw 'Expected exactly one baseline executable' }
            $variants.A = $baseline[0].FullName
            $order = @('A', 'B', 'B', 'A', 'B', 'A', 'A', 'B')
          }
          $metadata = @{
            candidate_source = $env:GITHUB_SHA
            baseline_source = $(if ($run) { $run.head_sha } else { $null })
            baseline_run = $env:BENCHMARK_BASELINE_RUN
            processor = $env:PROCESSOR_IDENTIFIER
            logical_processors = [Environment]::ProcessorCount
            os = [Environment]::OSVersion.VersionString
            runner_image = $env:ImageVersion
            order = $order
          }
          foreach ($variant in $variants.Keys) {
            $metadata[$variant] = @{ sha256 = (Get-FileHash $variants[$variant] -Algorithm SHA256).Hash }
          }
          $metadata | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "$output/binaries.json"
          for ($trial = 0; $trial -lt $order.Count; ++$trial) {
            $variant = $order[$trial]
            foreach ($mode in @('lists', 'views')) {
              & $variants[$variant] "benchmark-$mode" 11 |
                Set-Content -Encoding utf8 "$output/$mode-$trial-$variant.csv"
              if ($LASTEXITCODE -ne 0) { throw "Benchmark failed: $variant/$mode" }
            }
          }
      - name: Measure the bounded query expression candidate
        if: inputs.query_benchmarks && matrix.platform == 'x64'
        shell: pwsh
        run: |
          $output = '.quality/query-benchmarks'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $candidate = (Resolve-Path '.quality/runtime-tests/x64/Release/RuntimeTests.exe').Path
          @{
            source = $env:GITHUB_SHA
            executable_sha256 = (Get-FileHash $candidate -Algorithm SHA256).Hash
            harness_sha256 = (Get-FileHash RuntimeTests/RuntimeTests.cpp -Algorithm SHA256).Hash
            processor = $env:PROCESSOR_IDENTIFIER
            os = [Environment]::OSVersion.VersionString
            runner_image = $env:ImageVersion
            processes = 4
            debug_layer = $false
            no_game_or_present = $true
            comparison = 'same executable; repeated query vs already-assigned w49'
          } | ConvertTo-Json | Set-Content "$output/metadata.json" -Encoding utf8
          for ($trial = 0; $trial -lt 4; ++$trial) {
            & $candidate benchmark-queries 11 > "$output/queries-$trial.csv" 2> "$output/queries-$trial.stderr.log"
            if ($LASTEXITCODE -ne 0) { throw 'Query expression measurements failed' }
          }
      - name: Upload validated native test executable and mutation evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-checks-${{ matrix.platform }}-${{ github.sha }}
          path: |
            .quality/runtime-tests/${{ matrix.platform }}/Release/RuntimeTests.exe
            .quality/prepared-shaders/${{ matrix.platform }}/PreparedShaderTests.exe
            .quality/runtime-mutations/
            .quality/runtime-benchmarks/
            .quality/query-benchmarks/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload failure evidence without an executable
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-failure-evidence-${{ matrix.platform }}-${{ github.sha }}
          path: |
            .quality/runtime-mutations/
            .quality/runtime-benchmarks/
            .quality/query-benchmarks/
          if-no-files-found: ignore
          retention-days: 14
