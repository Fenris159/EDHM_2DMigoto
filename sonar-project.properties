sonar.organization=fenris159

sonar.sources=.
sonar.cfamily.compile-commands=bw-output/compile_commands.json
sonar.coverage.exclusions=**/*

# Compiled DirectXTK shader includes are not PHP. Disable PHP so leftover
# .inc blobs cannot be misclassified. Exclude generated/build trees.
sonar.php.file.suffixes=-
sonar.exclusions=\
  DirectXTK/Src/Shaders/Compiled/**,\
  vendor/**,\
  **/x32/**,\
  **/x64/**,\
  **/obj/**,\
  bw-output/**,\
  **/*.spritefont,\
  **/*.pdb,\
  **/*.inc

# The repository quality profile is intentionally correctness-first. Sonar bug,
# vulnerability, memory-safety, bounds, fallthrough, reachability, const-safety,
# polymorphic-destruction, and rule-of-five checks remain active. Mechanical C++
# modernization and legacy-architecture heuristics are enforced by the pinned
# compiler, clang-format, and clang-tidy policy instead. Reviewed ABI and vendor
# exceptions below are path-scoped; rationale is in docs/code-quality.md.
