sonar.projectKey=Fenris159_EDHM_2DMigoto
sonar.organization=fenris159

sonar.sources=.
sonar.cfamily.compile-commands=bw-output/compile_commands.json
sonar.coverage.exclusions=**/*

# Compiled DirectXTK shader includes are not PHP. Disable PHP so leftover
# .inc blobs cannot be misclassified. Exclude generated/build trees.
sonar.php.file.suffixes=-
sonar.exclusions=\
  DirectXTK/Src/Shaders/Compiled/**,\
  vendor/**,\
  **/x32/**,\
  **/x64/**,\
  **/obj/**,\
  bw-output/**,\
  **/*.spritefont,\
  **/*.pdb,\
  **/*.inc

# Do not suppress rules globally. Compatibility constraints and false positives
# are reviewed issue-by-issue so the project cannot appear clean by configuration.
