sonar.projectKey=Fenris159_EDHM_2DMigoto
sonar.organization=Fenris159

sonar.sources=.

# Compiled DirectXTK shader includes are not PHP. Disable PHP so leftover
# .inc blobs cannot be misclassified. Exclude generated/build trees.
sonar.php.file.suffixes=-
sonar.exclusions=\
  DirectXTK/Src/Shaders/Compiled/**,\
  vendor/**,\
  **/x32/**,\
  **/x64/**,\
  **/obj/**,\
  **/*.spritefont,\
  **/*.pdb,\
  **/*.inc

# C++14 project: std::format (S6494) is C++20. TODO/FIXME comments (S1135/S1134)
# document remaining work and are not runtime defects.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S6494
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=cpp:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=cpp:S1134
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
