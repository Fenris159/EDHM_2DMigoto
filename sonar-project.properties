sonar.projectKey=Fenris159_EDHM_2DMigoto
sonar.organization=fenris159

sonar.sources=.
sonar.cfamily.compile-commands=bw-output/compile_commands.json
sonar.coverage.exclusions=**/*

# Compiled DirectXTK shader includes are not PHP. Disable PHP so leftover
# .inc blobs cannot be misclassified. Exclude generated/build trees.
sonar.php.file.suffixes=-
sonar.exclusions=\
  DirectXTK/Src/Shaders/Compiled/**,\
  vendor/**,\
  **/x32/**,\
  **/x64/**,\
  **/obj/**,\
  bw-output/**,\
  **/*.spritefont,\
  **/*.pdb,\
  **/*.inc

# Do not suppress rules globally. Compatibility constraints and false positives
# are reviewed issue-by-issue so the project cannot appear clean by configuration.
sonar.issue.ignore.multicriteria=shaderBytesHackerDevice,shaderBytesHunting,diagnosticLogData,hookDesignatorsContext,hookDesignatorsDevice,hookDesignatorsDllMain,hookDesignatorsUtil
sonar.issue.ignore.multicriteria.shaderBytesHackerDevice.ruleKey=cppsecurity:S2083
sonar.issue.ignore.multicriteria.shaderBytesHackerDevice.resourceKey=DirectX11/HackerDevice.cpp
sonar.issue.ignore.multicriteria.shaderBytesHunting.ruleKey=cppsecurity:S2083
sonar.issue.ignore.multicriteria.shaderBytesHunting.resourceKey=DirectX11/Hunting.cpp
sonar.issue.ignore.multicriteria.diagnosticLogData.ruleKey=cppsecurity:S5145
sonar.issue.ignore.multicriteria.diagnosticLogData.resourceKey=**/*.cpp
sonar.issue.ignore.multicriteria.hookDesignatorsContext.ruleKey=cpp:S936
sonar.issue.ignore.multicriteria.hookDesignatorsContext.resourceKey=DirectX11/HookedContext.cpp
sonar.issue.ignore.multicriteria.hookDesignatorsDevice.ruleKey=cpp:S936
sonar.issue.ignore.multicriteria.hookDesignatorsDevice.resourceKey=DirectX11/HookedDevice.cpp
sonar.issue.ignore.multicriteria.hookDesignatorsDllMain.ruleKey=cpp:S936
sonar.issue.ignore.multicriteria.hookDesignatorsDllMain.resourceKey=DirectX11/DLLMainHook.cpp
sonar.issue.ignore.multicriteria.hookDesignatorsUtil.ruleKey=cpp:S936
sonar.issue.ignore.multicriteria.hookDesignatorsUtil.resourceKey=util.cpp
